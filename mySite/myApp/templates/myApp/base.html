<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <nav class= "bg-blue-300">
        <div class="flex justify-between p-8 text-white">
            <a href="" class="font-bold text-2xl">Food App</a>
            <div space-x-6>
                <a href="">Contact </a>
                <a href="">Address </a>
                <a href="">About us </a>
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}">Login</a>
                {% endif %}
            </div>

        </div>
    </nav>
    {% if messages %}
        {% for message in messages %}
            <div class="bg-green-400 text-green-700">
                {{message}}
            </div>
        {% endfor %}
    {% endif %}
    
    {% block body %}


    {% endblock %}
    
</body>
</html>
