{% extends 'myApp/base.html' %}

{% block body %}
    <div>
        {%for item in item_list%}
        <div class = "m-10 flex w-1/2 mx-auto">
            <div>
                <img class="w-64 rounded-lg" src="{{item.item_image}}">
            </div>
            <div class="mx-6">
                <div class="font-bold">{{item.item_name}}</div>
                <div class="text-green-700">${{item.item_price}}</div>
                <div>{{item.item_desc}}</div>
            
            </div>
            <div > 
                <a class="bg-blue-500 mt-3 p-2 rounded-lg" href="{%url 'myApp:detail' item.id%}"> View details</a>
            </div>

        </div>
        {% endfor %}
    </div>



{% endblock %}
